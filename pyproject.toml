[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darefx"
version = "1.1.0"
description = "Automated quantitative multi-asset trading terminal and ML execution engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <3.13"
authors = [{ name = "darefx" }]

dependencies = [
    # Data
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",

    # Technical indicators
    "pandas-ta>=0.3.14b1",

    # ML
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "optuna>=4.0",

    # Backtesting
    "vectorbt>=0.26",

    # Notifications
    "python-telegram-bot>=21.0",

    # Visualization
    "matplotlib>=3.9",
    "plotly>=5.24, <6.0.0",

    # Config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",

    # CLI
    "typer>=0.12",
    "rich>=13.8",

    # Cloud MT5 Bridge
    "metaapi-cloud-sdk>=29.0",

    # Crypto Exchange Connectivity (CCXT)
    "ccxt>=4.4.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7.0",
]
mt5 = [
    # Windows-only, install when needed for live trading
    # "MetaTrader5>=5.0.4424",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[project.scripts]
darefx = "darefx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/darefx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
